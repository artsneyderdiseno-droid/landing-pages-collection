<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creaciones Luisart - Arte hecho a mano</title>
  <meta name="description" content="Creaciones Luisart: Arte hecho a mano con amor. Crochet, cerámica artística y creaciones totalmente personalizadas en Bogotá.">
  
  <!-- Favicon actualizado -->
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/pj8V8TZ9/creaciones-luisart.jpg" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#F6F3EB',
              text: '#362E2B',
              accent: '#E59A01',
              secondary: '#B9B9B6',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'blob': 'blob 7s infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'fade-in': 'fade-in 0.5s ease-out',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0) rotate(-2deg)' },
              '50%': { transform: 'translateY(-15px) rotate(2deg)' },
            },
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            'fade-in': {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      overflow-x: hidden;
      background-color: #F6F3EB;
      color: #362E2B;
    }
    html { 
      scroll-behavior: smooth; 
    }
    
    /* Pantalla de carga */
    #loader {
      position: fixed;
      inset: 0;
      background: #F6F3EB;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease-out;
    }
    .loader-logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(229, 154, 1, 0.2);
      animation: pulse-slow 2s infinite;
    }

    .glass-nav { 
      background: rgba(246, 243, 235, 0.85); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px); 
      border-bottom: 1px solid rgba(185, 185, 182, 0.2); 
    }
    .fade-up { 
      opacity: 0; 
      transform: translateY(30px); 
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
    }
    .fade-up.visible { 
      opacity: 1; 
      transform: translateY(0); 
    }
    
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #F6F3EB; }
    ::-webkit-scrollbar-thumb { background: #B9B9B6; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #E59A01; }
    
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="transition-colors duration-300">
  
  <div id="loader">
    <img src="https://i.ibb.co/pj8V8TZ9/creaciones-luisart.jpg" class="loader-logo" alt="Cargando Creaciones Luisart..." />
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const LOGO_URL = "https://i.ibb.co/pj8V8TZ9/creaciones-luisart.jpg";
    const WHATSAPP_NUMBER = "573143413326";
    const WHATSAPP_LINK = `https://wa.me/${WHATSAPP_NUMBER}`;
    const INSTAGRAM_LINK = "https://instagram.com/creaciones_luisart";

    const PRODUCTS = [
      { id: 1, name: "Amigurumi Homero Simpson", price: 85000, category: "Crochet", desc: "Muñeco tejido totalmente a mano inspirado en Homero Simpson. Materiales hipoalergénicos.", image: "https://i.ibb.co/35nLmpzz/luisa-martinez-2.jpg", badge: "Destacado" },
      { id: 2, name: "Alcancía Personalizada", price: 45000, category: "Cerámica", desc: "Alcancía de cerámica artística pintada a mano. Elige tu diseño o personaje favorito.", image: "https://i.ibb.co/JwQwtH55/luisa-martinez-1.png", badge: "Popular" },
      { id: 3, name: "Amigurumi Marge Simpson", price: 90000, category: "Crochet", desc: "La icónica Marge Simpson en versión crochet. Un regalo único y especial.", image: "https://i.ibb.co/xtY6SRRp/luisa-martinez-2.png" },
      { id: 4, name: "Muñeco Personalizado", price: 110000, category: "Personalizado", desc: "Tejemos a esa persona especial, mascota o personaje que imagines a partir de una foto.", image: "https://i.ibb.co/BH8TM9hF/luisa-martinez-3.png", badge: "Más Vendido" },
      { id: 5, name: "Figura Mario Bros", price: 55000, category: "Cerámica", desc: "Figura decorativa de Mario Bros en cerámica, modelada y pintada artesanalmente.", image: "https://i.ibb.co/xKnvQ815/luisa-martinez-4.png" },
      { id: 6, name: "Figura Charmander", price: 50000, category: "Cerámica", desc: "Para los fans de Pokémon, figura de Charmander pintada a mano con amor.", image: "https://i.ibb.co/dH75cmv/luisa-martinez-5.png" },
      { id: 7, name: "Virgen de Guadalupe", price: 75000, category: "Cerámica", desc: "Figura religiosa con detalles dorados, pintada con máxima delicadeza.", image: "https://i.ibb.co/BH8TM9hF/luisa-martinez-3.png", badge: "Elegante" },
      { id: 8, name: "Figura Escandalosos", price: 60000, category: "Cerámica", desc: "Los amados osos Escandalosos en una sola pieza de cerámica artística.", image: "https://i.ibb.co/BH8TM9hF/luisa-martinez-3.png" },
      { id: 9, name: "Mascota en Cerámica", price: 85000, category: "Personalizado", desc: "Envíanos la foto de tu mascota y la inmortalizamos en una figura de cerámica pintada.", image: "https://i.ibb.co/BH8TM9hF/luisa-martinez-3.png", badge: "Exclusivo" },
      { id: 10, name: "Piezas para Pintar", price: 25000, category: "Cerámica", desc: "Lleva la pieza de cerámica en blanco y despierta tu lado artístico pintándola en casa.", image: "https://i.ibb.co/BH8TM9hF/luisa-martinez-3.png" }
    ];

    const formatPrice = (price) => {
      return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(price);
    };

    const Icons = {
      Cart: ({ className = "w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>),
      Heart: ({ className = "w-6 h-6", filled = false }) => (<svg className={className} fill={filled ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>),
      Search: ({ className = "w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>),
      Close: ({ className = "w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>),
      WhatsApp: ({ className = "w-6 h-6" }) => (<svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 0C5.385 0 0 5.385 0 12.031c0 2.12.551 4.185 1.597 6.002L.013 24l6.113-1.603c1.748.951 3.719 1.453 5.905 1.453 6.646 0 12.031-5.385 12.031-12.031S18.677 0 12.031 0zm0 21.849c-1.785 0-3.53-.479-5.062-1.385l-.362-.214-3.766.988.997-3.673-.235-.373a9.972 9.972 0 01-1.523-5.343c0-5.514 4.486-10 10-10s10 4.486 10 10-4.486 10-10 10zm5.496-7.514c-.302-.151-1.786-.882-2.063-.983-.277-.101-.479-.151-.68.151-.202.302-.781.983-.958 1.185-.176.202-.353.227-.655.076-1.558-.787-2.735-1.728-3.805-3.23-.209-.294-.022-.452.128-.603.136-.135.302-.353.453-.529.151-.176.202-.302.302-.504.101-.202.05-.378-.025-.529-.076-.151-.68-1.639-.933-2.244-.246-.593-.496-.513-.68-.522h-.58c-.202 0-.529.076-.806.378-.277.302-1.058 1.034-1.058 2.52 0 1.487 1.083 2.924 1.234 3.125.151.202 2.128 3.25 5.155 4.557.72.31 1.282.496 1.72.635.723.23 1.382.197 1.902.12.584-.086 1.786-.73 2.038-1.436.252-.705.252-1.31.176-1.436-.076-.126-.277-.202-.579-.353z"/></svg>),
      Instagram: ({ className = "w-6 h-6" }) => (<svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.7-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>),
      Check: ({ className = "w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>),
      Sparkle: ({ className = "w-5 h-5" }) => (<svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L13.5 9.5L21 11L13.5 12.5L12 20L10.5 12.5L3 11L10.5 9.5L12 2Z"/></svg>)
    };

    const Toast = ({ message, type, onClose }) => {
      useEffect(() => {
        const timer = setTimeout(onClose, 3000);
        return () => clearTimeout(timer);
      }, [onClose]);

      return (
        <div className="fixed bottom-24 right-5 z-50 animate-[fade-in_0.3s_ease-out]">
          <div className={`flex items-center px-5 py-4 rounded-2xl shadow-xl text-white ${type === 'error' ? 'bg-red-500' : 'bg-brand-text border border-brand-secondary/30'}`}>
            <Icons.Check className={`mr-2 ${type === 'error' ? 'text-white' : 'text-brand-accent'}`} />
            <span className="font-bold text-sm tracking-wide">{message}</span>
          </div>
        </div>
      );
    };

    function App() {
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeFilter, setActiveFilter] = useState('Todos');
      const [toast, setToast] = useState(null);
      
      const sectionRefs = useRef([]);

      useEffect(() => {
        // Ocultar loader cuando React monta
        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.style.display = 'none', 600);
        }
      }, []);

      const filteredProducts = PRODUCTS.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.category.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesFilter = activeFilter === 'Todos' || p.category === activeFilter;
        return matchesSearch && matchesFilter;
      });

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
            }
          });
        }, { threshold: 0.1 });

        sectionRefs.current.forEach(ref => {
          if (ref) observer.observe(ref);
        });

        return () => observer.disconnect();
      }, [filteredProducts]);

      const addToRefs = (el) => {
        if (el && !sectionRefs.current.includes(el)) {
          sectionRefs.current.push(el);
        }
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
      };

      const addToCart = (product) => {
        const existing = cart.find(item => item.id === product.id);
        if (existing) {
          setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
        } else {
          setCart([...cart, { ...product, qty: 1 }]);
        }
        showToast(`${product.name} agregado al carrito`);
        setIsCartOpen(true);
      };

      const updateCartQty = (id, delta) => {
        setCart(cart.map(item => {
          if (item.id === id) {
            return { ...item, qty: Math.max(1, item.qty + delta) };
          }
          return item;
        }));
      };

      const removeFromCart = (id) => {
        setCart(cart.filter(item => item.id !== id));
      };

      const toggleWishlist = (id) => {
        if (wishlist.includes(id)) {
          setWishlist(wishlist.filter(itemId => itemId !== id));
        } else {
          setWishlist([...wishlist, id]);
          showToast('Agregado a favoritos');
        }
      };

      const cartTotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
      const cartCount = cart.reduce((acc, item) => acc + item.qty, 0);

      const filterOptions = ['Todos', 'Crochet', 'Cerámica', 'Personalizado'];

      const Navbar = () => (
        <nav className="fixed w-full z-40 top-0 transition-all duration-300 glass-nav shadow-sm">
          <div className="bg-brand-accent text-white text-xs sm:text-sm font-bold py-2 text-center px-4 flex justify-center items-center gap-2 tracking-wide">
            <Icons.Sparkle className="w-4 h-4" />
            <span>Arte, Crochet y Cerámica - Trabajos hechos con amor</span>
            <Icons.Sparkle className="w-4 h-4" />
          </div>
          
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between items-center h-16 sm:h-20">
              
              <a href="#inicio" className="flex items-center space-x-3 group active:scale-95 transition-transform duration-200">
                <img 
                  src={LOGO_URL} 
                  alt="Creaciones Luisart Logo" 
                  className="h-10 w-10 sm:h-12 sm:w-12 object-cover rounded-full shadow-md border-2 border-brand-accent/20 group-hover:border-brand-accent transition-all duration-300"
                />
                <span className="font-extrabold text-lg sm:text-xl text-brand-text tracking-tight hidden sm:block">Creaciones Luisart</span>
              </a>
              
              <div className="hidden md:flex space-x-8">
                <a href="#inicio" className="font-bold text-brand-text/80 hover:text-brand-accent transition-colors">Inicio</a>
                <a href="#personalizados" className="font-bold text-brand-text/80 hover:text-brand-accent transition-colors">Personalizados</a>
                <a href="#catalogo" className="font-bold text-brand-text/80 hover:text-brand-accent transition-colors">Productos</a>
                <a href="#nosotros" className="font-bold text-brand-text/80 hover:text-brand-accent transition-colors">Nosotros</a>
              </div>

              <div className="flex items-center space-x-4 sm:space-x-5">
                <button className="relative text-brand-text/80 hover:text-brand-accent active:scale-90 transition-all hidden sm:block">
                  <Icons.Heart />
                  {wishlist.length > 0 && <span className="absolute -top-1 -right-2 bg-brand-accent text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">{wishlist.length}</span>}
                </button>
                <button className="relative text-brand-text/80 hover:text-brand-accent active:scale-90 transition-all" onClick={() => setIsCartOpen(true)}>
                  <Icons.Cart />
                  {cartCount > 0 && <span className="absolute -top-2 -right-2 bg-brand-text text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-md animate-bounce">{cartCount}</span>}
                </button>
              </div>
            </div>
          </div>
        </nav>
      );

      const ProductCard = ({ product }) => {
        const isWishlisted = wishlist.includes(product.id);

        return (
          <div className="group bg-white rounded-[30px] shadow-sm hover:shadow-2xl transition-all duration-500 overflow-hidden border border-brand-secondary/20 flex flex-col h-full fade-up relative" ref={addToRefs}>
            <div className="relative overflow-hidden aspect-square bg-brand-bg/50 flex items-center justify-center border-b border-brand-secondary/10">
              
              <div className="absolute inset-0 bg-gradient-to-tr from-brand-accent/0 to-brand-accent/0 group-hover:from-brand-accent/5 group-hover:to-transparent transition-all duration-500 z-0"></div>

              <img src={product.image} alt={product.name} className="w-full h-full object-cover relative z-10 group-hover:scale-105 transition-transform duration-700 ease-out" />
              
              <div className="absolute top-4 left-4 flex flex-col gap-2 z-20">
                {product.badge && <span className="bg-brand-text text-brand-bg text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-wider shadow-md">{product.badge}</span>}
              </div>

              <button onClick={() => toggleWishlist(product.id)} className="absolute top-4 right-4 p-3 bg-white/90 backdrop-blur-md rounded-full shadow-sm hover:scale-110 active:scale-90 transition-all z-20 text-brand-secondary">
                <Icons.Heart filled={isWishlisted} className={isWishlisted ? "text-brand-accent w-5 h-5" : "w-5 h-5"} />
              </button>
              
              <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent pt-24 pb-6 px-4 flex items-end justify-center translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-out z-20">
                 <div className="w-full bg-white p-5 rounded-2xl shadow-2xl transform scale-95 group-hover:scale-100 transition-transform duration-500 delay-100 text-center">
                    <p className="text-sm font-bold text-brand-text mb-3">Pieza artesanal única</p>
                    <button onClick={() => addToCart(product)} className="w-full bg-brand-accent text-white py-3 rounded-xl text-sm font-bold hover:bg-[#cc8901] transition-colors shadow-lg active:scale-95 flex items-center justify-center gap-2">
                      <Icons.Cart className="w-4 h-4"/> Agregar al pedido
                    </button>
                 </div>
              </div>
            </div>
            
            <div className="p-6 flex-1 flex flex-col justify-between bg-white z-10 relative">
              <div>
                <div className="flex justify-between items-start mb-3 gap-3">
                  <h3 className="font-extrabold text-lg text-brand-text leading-tight group-hover:text-brand-accent transition-colors">{product.name}</h3>
                  <span className="font-black text-brand-accent text-lg whitespace-nowrap">{formatPrice(product.price)}</span>
                </div>
                <p className="text-sm text-brand-text/70 line-clamp-2 mb-5 font-medium leading-relaxed">{product.desc}</p>
              </div>
              <div className="flex items-center text-[11px] font-black text-brand-secondary uppercase tracking-wider">
                <span className="bg-brand-bg px-3 py-1.5 rounded-lg text-brand-text/80">{product.category}</span>
              </div>
            </div>
          </div>
        );
      };

      const CartSidebar = () => (
        <>
          <div className={`fixed inset-0 bg-black/40 backdrop-blur-sm z-50 transition-opacity duration-400 ${isCartOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={() => setIsCartOpen(false)} />
          
          <div className={`fixed top-0 right-0 h-full w-full sm:w-[480px] bg-white z-50 shadow-2xl transform transition-transform duration-500 cubic-bezier(0.16, 1, 0.3, 1) ${isCartOpen ? 'translate-x-0' : 'translate-x-full'} flex flex-col`}>
            <div className="px-6 py-6 border-b border-brand-secondary/20 flex justify-between items-center bg-white">
              <h2 className="text-2xl font-extrabold text-brand-text flex items-center">
                <Icons.Cart className="mr-3 text-brand-accent w-7 h-7" /> Tu Pedido ({cartCount})
              </h2>
              <button onClick={() => setIsCartOpen(false)} className="p-2.5 bg-brand-bg rounded-full text-brand-text/70 hover:text-brand-accent transition-all active:scale-90">
                <Icons.Close className="w-5 h-5" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-6 space-y-4 bg-brand-bg/50">
              {cart.length === 0 ? (
                <div className="text-center text-brand-text/50 mt-32 flex flex-col items-center">
                  <div className="w-28 h-28 bg-white shadow-sm rounded-full flex items-center justify-center mb-6 border border-brand-secondary/20">
                    <Icons.Sparkle className="w-14 h-14 opacity-40" />
